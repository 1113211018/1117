<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Plumber HTML5</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #1a1a2e;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-wrapper {
      position: relative;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      overflow: hidden;
      border: 4px solid #34495e;
      max-width: 100vw;
    }
    canvas {
      display: block;
      background-color: #5c94fc;
      max-width: 100%;
      height: auto;
    }
    /* 手機與觸控螢幕虛擬按鍵 */
    #mobile-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      padding: 12px 20px;
    }
    .ctrl-group {
      display: flex;
      gap: 15px;
    }
    .btn {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      color: white;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }
    .btn:active {
      background: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<div id="mobile-controls">
  <div class="ctrl-group">
    <div class="btn" id="btn-left">◀</div>
    <div class="btn" id="btn-right">▶</div>
  </div>
  <div class="ctrl-group">
    <div class="btn" id="btn-jump">▲</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // 遊戲常數與狀態
  const GRAVITY = 0.55;
  const LEVEL_WIDTH = 3200;
  let cameraX = 0;
  let score = 0;
  let coinsCount = 0;
  let gameState = 'PLAYING'; // 'PLAYING', 'GAMEOVER', 'WIN'

  // 按鍵狀態
  const keys = { left: false, right: false, up: false };

  // 主角（紅帽水管工）
  const player = {
    x: 80,
    y: 300,
    width: 30,
    height: 38,
    vx: 0,
    vy: 0,
    speed: 4.5,
    jumpPower: -12.5,
    grounded: false,
    facing: 1, // 1: 右, -1: 左
    walkFrame: 0,

    reset() {
      this.x = 80;
      this.y = 300;
      this.vx = 0;
      this.vy = 0;
      this.grounded = false;
      this.facing = 1;
    },

    update() {
      if (gameState !== 'PLAYING') return;

      // 左右移動
      if (keys.left) {
        this.vx = -this.speed;
        this.facing = -1;
        this.walkFrame += 0.2;
      } else if (keys.right) {
        this.vx = this.speed;
        this.facing = 1;
        this.walkFrame += 0.2;
      } else {
        this.vx *= 0.8;
        if (Math.abs(this.vx) < 0.1) this.vx = 0;
        this.walkFrame = 0;
      }

      // 跳躍
      if (keys.up && this.grounded) {
        this.vy = this.jumpPower;
        this.grounded = false;
      }

      this.vy += GRAVITY;

      // X 軸移動與碰撞
      this.x += this.vx;
      if (this.x < 0) this.x = 0;
      if (this.x + this.width > LEVEL_WIDTH) this.x = LEVEL_WIDTH - this.width;
      checkHorizontalCollisions();

      // Y 軸移動與碰撞
      this.y += this.vy;
      this.grounded = false;
      checkVerticalCollisions();

      // 掉落深淵判定
      if (this.y > canvas.height + 50) {
        gameState = 'GAMEOVER';
      }

      // 到達終點旗桿判定
      if (this.x + this.width >= flagpole.x) {
        score += 1000;
        gameState = 'WIN';
      }

      // 更新攝影機跟隨
      cameraX = this.x - canvas.width * 0.35;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > LEVEL_WIDTH - canvas.width) cameraX = LEVEL_WIDTH - canvas.width;
    },

    draw() {
      ctx.save();
      ctx.translate(this.x - cameraX + this.width / 2, this.y + this.height / 2);
      ctx.scale(this.facing, 1);

      const w = this.width;
      const h = this.height;

      // 紅色帽子
      ctx.fillStyle = '#e52521';
      ctx.fillRect(-w / 2 + 2, -h / 2, w - 4, 7);
      ctx.fillRect(-w / 2 + 2, -h / 2 + 4, w + 2, 4);

      // 臉部膚色
      ctx.fillStyle = '#fbc093';
      ctx.fillRect(-w / 2 + 4, -h / 2 + 8, w - 6, 11);

      // 眼睛與鬍子
      ctx.fillStyle = '#000000';
      ctx.fillRect(4, -h / 2 + 9, 3, 4); // 眼
      ctx.fillRect(2, -h / 2 + 15, 10, 3); // 鬍子

      // 紅色上衣與藍色吊帶褲
      ctx.fillStyle = '#e52521';
      ctx.fillRect(-w / 2 + 3, -h / 2 + 19, w - 6, 10);
      ctx.fillStyle = '#2962ff';
      ctx.fillRect(-w / 2 + 5, -h / 2 + 21, w - 10, 11);

      // 吊帶褲黃色鈕扣
      ctx.fillStyle = '#ffd600';
      ctx.fillRect(-2, -h / 2 + 22, 3, 3);
      ctx.fillRect(5, -h / 2 + 22, 3, 3);

      // 棕色鞋子（走路擺動動畫）
      ctx.fillStyle = '#6d4c41';
      const swing = this.grounded ? Math.sin(this.walkFrame) * 4 : 3;
      ctx.fillRect(-w / 2 + 2 - swing, h / 2 - 6, 11, 6);
      ctx.fillRect(2 + swing, h / 2 - 6, 11, 6);

      ctx.restore();
    }
  };

  // 地圖物件資料（地板、磚塊、問號方塊、水管）
  let blocks = [];
  let enemies = [];
  let coins = [];
  let floatingTexts = [];

  const flagpole = { x: 3020, y: 130, height: 260 };

  function initLevel() {
    blocks = [];
    enemies = [];
    coins = [];
    floatingTexts = [];

    // 1. 建立地板（含兩處陷阱坑洞）
    for (let x = 0; x < LEVEL_WIDTH; x += 40) {
      if ((x >= 720 && x < 840) || (x >= 1880 && x < 2000)) continue; // 坑洞
      blocks.push({ x, y: 390, w: 40, h: 60, type: 'GROUND' });
    }

    // 2. 空中磚塊與問號方塊（hit: 是否已被頂過）
    const aerialBlocks = [
      { x: 280, y: 270, type: 'BRICK' },
      { x: 320, y: 270, type: 'QUESTION', hit: false },
      { x: 360, y: 270, type: 'BRICK' },
      { x: 400, y: 270, type: 'QUESTION', hit: false },
      { x: 440, y: 270, type: 'BRICK' },
      { x: 360, y: 160, type: 'QUESTION', hit: false },

      { x: 960, y: 270, type: 'BRICK' },
      { x: 1000, y: 270, type: 'QUESTION', hit: false },
      { x: 1040, y: 270, type: 'BRICK' },

      { x: 1320, y: 250, type: 'BRICK' },
      { x: 1360, y: 250, type: 'BRICK' },
      { x: 1400, y: 250, type: 'QUESTION', hit: false },
      { x: 1440, y: 250, type: 'BRICK' },

      { x: 2150, y: 270, type: 'QUESTION', hit: false },
      { x: 2190, y: 270, type: 'BRICK' },
      { x: 2230, y: 270, type: 'QUESTION', hit: false },
    ];
    aerialBlocks.forEach(b => blocks.push({ x: b.x, y: b.y, w: 40, h: 40, type: b.type, hit: b.hit || false }));

    // 3. 綠色水管障礙
    const pipesData = [
      { x: 560, y: 330, h: 60 },
      { x: 1160, y: 300, h: 90 },
      { x: 1620, y: 280, h: 110 },
      { x: 2450, y: 310, h: 80 }
    ];
    pipesData.forEach(p => blocks.push({ x: p.x, y: p.y, w: 56, h: p.h, type: 'PIPE' }));

    // 4. 階梯磚塊（終點前）
    for (let step = 0; step < 5; step++) {
      for (let h = 0; h <= step; h++) {
        blocks.push({
          x: 2700 + step * 40,
          y: 350 - h * 40,
          w: 40,
          h: 40,
          type: 'HARD'
        });
      }
    }

    // 5. 空中漂浮金幣
    const coinCoords = [
      [320, 220], [360, 220], [400, 220],
      [760, 260], [800, 260],
      [1340, 200], [1380, 200], [1420, 200],
      [1920, 250], [1960, 250],
      [2550, 260], [2590, 260], [2630, 260]
    ];
    coinCoords.forEach(([cx, cy]) => coins.push({ x: cx + 10, y: cy, collected: false }));

    // 6. 巡邏板栗怪（可踩扁）
    enemies = [
      { x: 480, y: 358, w: 32, h: 32, vx: -1.3, alive: true, minX: 200, maxX: 550 },
      { x: 1050, y: 358, w: 32, h: 32, vx: -1.4, alive: true, minX: 860, maxX: 1150 },
      { x: 1450, y: 358, w: 32, h: 32, vx: -1.5, alive: true, minX: 1230, maxX: 1600 },
      { x: 2250, y: 358, w: 32, h: 32, vx: -1.6, alive: true, minX: 2020, maxX: 2430 }
    ];
  }

  // AABB 碰撞輔助函式
  function rectIntersect(r1, r2) {
    return !(
      r2.x >= r1.x + r1.width ||
      r2.x + r2.w <= r1.x ||
      r2.y >= r1.y + r1.height ||
      r2.y + r2.h <= r1.y
    );
  }

  function checkHorizontalCollisions() {
    for (let b of blocks) {
      if (rectIntersect(player, b)) {
        if (player.vx > 0) {
          player.x = b.x - player.width;
        } else if (player.vx < 0) {
          player.x = b.x + b.w;
        }
        player.vx = 0;
      }
    }
  }

  function checkVerticalCollisions() {
    for (let i = blocks.length - 1; i >= 0; i--) {
      let b = blocks[i];
      if (rectIntersect(player, b)) {
        if (player.vy > 0) {
          // 踩在方塊上
          player.y = b.y - player.height;
          player.vy = 0;
          player.grounded = true;
        } else if (player.vy < 0) {
          // 頭頂撞擊方塊
          player.y = b.y + b.h;
          player.vy = 0;

          if (b.type === 'QUESTION' && !b.hit) {
            b.hit = true;
            coinsCount++;
            score += 200;
            spawnFloatingText('+200', b.x + 10, b.y - 10);
          } else if (b.type === 'BRICK') {
            // 頂碎磚塊
            score += 50;
            spawnFloatingText('+50', b.x + 10, b.y - 10);
            blocks.splice(i, 1);
          }
        }
      }
    }
  }

  function spawnFloatingText(text, x, y) {
    floatingTexts.push({ text, x, y, life: 40 });
  }

  function updateEntities() {
    if (gameState !== 'PLAYING') return;

    // 更新金幣收集
    for (let c of coins) {
      if (!c.collected) {
        const coinBox = { x: c.x, y: c.y, w: 20, h: 24 };
        if (rectIntersect(player, coinBox)) {
          c.collected = true;
          coinsCount++;
          score += 100;
          spawnFloatingText('+100', c.x, c.y - 10);
        }
      }
    }

    // 更新怪物移動與踩踏判定
    for (let e of enemies) {
      if (!e.alive) continue;

      e.x += e.vx;
      if (e.x <= e.minX || e.x + e.w >= e.maxX) {
        e.vx *= -1;
      }

      const enemyBox = { x: e.x, y: e.y, w: e.w, h: e.h };
      if (rectIntersect(player, enemyBox)) {
        // 判斷是否從上方踩踏怪物
        if (player.vy > 0 && player.y + player.height - player.vy <= e.y + 14) {
          e.alive = false;
          player.vy = -8.5; // 踩扁後小彈跳
          score += 200;
          spawnFloatingText('+200', e.x, e.y - 10);
        } else {
          gameState = 'GAMEOVER';
        }
      }
    }

    // 更新飄浮得分文字
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      floatingTexts[i].y -= 1;
      floatingTexts[i].life--;
      if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
    }
  }

  // 繪製背景（藍天、白雲、遠山）
  function drawBackground() {
    ctx.fillStyle = '#5c94fc';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 遠山（視差捲動）
    ctx.fillStyle = '#00a800';
    for (let i = 0; i < LEVEL_WIDTH; i += 450) {
      const mx = i - cameraX * 0.5;
      ctx.beginPath();
      ctx.moveTo(mx, 390);
      ctx.lineTo(mx + 90, 270);
      ctx.lineTo(mx + 180, 390);
      ctx.fill();
    }

    // 白雲
    ctx.fillStyle = '#ffffff';
    for (let i = 100; i < LEVEL_WIDTH; i += 380) {
      const cx = i - cameraX * 0.3;
      ctx.beginPath();
      ctx.arc(cx, 90, 22, 0, Math.PI * 2);
      ctx.arc(cx + 22, 82, 26, 0, Math.PI * 2);
      ctx.arc(cx + 46, 90, 22, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawWorld() {
    // 繪製方塊與水管
    for (let b of blocks) {
      const bx = b.x - cameraX;
      if (bx + b.w < -50 || bx > canvas.width + 50) continue;

      if (b.type === 'GROUND') {
        ctx.fillStyle = '#c84c0c';
        ctx.fillRect(bx, b.y, b.w, b.h);
        ctx.fillStyle = '#00a800';
        ctx.fillRect(bx, b.y, b.w, 10);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(bx, b.y, b.w, b.h);
      } else if (b.type === 'BRICK') {
        ctx.fillStyle = '#b83c08';
        ctx.fillRect(bx, b.y, b.w, b.h);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(bx, b.y, b.w, b.h);
        // 磚縫線條
        ctx.beginPath();
        ctx.moveTo(bx, b.y + 20);
        ctx.lineTo(bx + b.w, b.y + 20);
        ctx.moveTo(bx + 20, b.y);
        ctx.lineTo(bx + 20, b.y + 20);
        ctx.stroke();
      } else if (b.type === 'QUESTION') {
        ctx.fillStyle = b.hit ? '#8d6e63' : '#f8b800';
        ctx.fillRect(bx, b.y, b.w, b.h);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(bx, b.y, b.w, b.h);
        if (!b.hit) {
          ctx.fillStyle = '#000';
          ctx.font = 'bold 24px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('?', bx + 20, b.y + 29);
        }
      } else if (b.type === 'HARD') {
        ctx.fillStyle = '#795548';
        ctx.fillRect(bx, b.y, b.w, b.h);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(bx, b.y, b.w, b.h);
      } else if (b.type === 'PIPE') {
        ctx.fillStyle = '#00a800';
        ctx.fillRect(bx + 4, b.y + 22, b.w - 8, b.h - 22);
        ctx.strokeStyle = '#000';
        ctx.strokeRect(bx + 4, b.y + 22, b.w - 8, b.h - 22);
        // 管口
        ctx.fillRect(bx, b.y, b.w, 22);
        ctx.strokeRect(bx, b.y, b.w, 22);
      }
    }

    // 繪製終點旗桿與城堡
    const fx = flagpole.x - cameraX;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(fx, flagpole.y, 6, flagpole.height);
    ctx.fillStyle = '#ffd600';
    ctx.beginPath();
    ctx.arc(fx + 3, flagpole.y, 9, 0, Math.PI * 2);
    ctx.fill();
    // 旗幟
    ctx.fillStyle = '#e52521';
    ctx.beginPath();
    ctx.moveTo(fx + 6, flagpole.y + 12);
    ctx.lineTo(fx + 52, flagpole.y + 28);
    ctx.lineTo(fx + 6, flagpole.y + 44);
    ctx.fill();

    // 終點小城堡
    const castleX = fx + 85;
    ctx.fillStyle = '#c84c0c';
    ctx.fillRect(castleX, 290, 90, 100);
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(castleX + 45, 390, 20, Math.PI, 0);
    ctx.fill();

    // 繪製金幣
    for (let c of coins) {
      if (c.collected) continue;
      const cx = c.x - cameraX;
      ctx.fillStyle = '#ffd600';
      ctx.beginPath();
      ctx.ellipse(cx + 10, c.y + 12, 8, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#b28900';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // 繪製板栗怪
    for (let e of enemies) {
      if (!e.alive) continue;
      const ex = e.x - cameraX;
      // 蘑菇頭
      ctx.fillStyle = '#8d4925';
      ctx.beginPath();
      ctx.arc(ex + e.w / 2, e.y + 14, 15, Math.PI, 0);
      ctx.fill();
      // 身體與腳
      ctx.fillStyle = '#fbc093';
      ctx.fillRect(ex + 8, e.y + 14, 16, 12);
      ctx.fillStyle = '#000';
      ctx.fillRect(ex + 5, e.y + 26, 9, 6);
      ctx.fillRect(ex + 18, e.y + 26, 9, 6);
      // 兇狠眉毛
      ctx.fillRect(ex + 9, e.y + 8, 4, 5);
      ctx.fillRect(ex + 19, e.y + 8, 4, 5);
    }

    // 繪製飄浮文字
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    for (let ft of floatingTexts) {
      ctx.fillText(ft.text, ft.x - cameraX, ft.y);
    }
  }

  function drawHUD() {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3;
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'left';

    const hudText = `SCORE: ${String(score).padStart(5, '0')}    COINS: ${coinsCount}`;
    ctx.strokeText(hudText, 24, 34);
    ctx.fillText(hudText, 24, 34);

    if (gameState === 'GAMEOVER' || gameState === 'WIN') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';
      ctx.fillStyle = gameState === 'WIN' ? '#ffd600' : '#ff5252';
      ctx.font = 'bold 46px sans-serif';
      ctx.fillText(gameState === 'WIN' ? 'COURSE CLEAR!' : 'GAME OVER', canvas.width / 2, 190);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText(`最終得分：${score}`, canvas.width / 2, 240);
      ctx.fillText('按 Enter 或點擊畫面重新開始', canvas.width / 2, 290);
    }
  }

  function restartGame() {
    score = 0;
    coinsCount = 0;
    cameraX = 0;
    player.reset();
    initLevel();
    gameState = 'PLAYING';
  }

  // 鍵盤事件監聽
  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      keys.up = true;
    }
    if (e.code === 'Enter' && gameState !== 'PLAYING') {
      restartGame();
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
  });

  // 觸控事件監聽
  canvas.addEventListener('mousedown', () => {
    if (gameState !== 'PLAYING') restartGame();
  });

  function bindTouchBtn(id, keyName) {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState !== 'PLAYING') restartGame();
      keys[keyName] = true;
    }, { passive: false });
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      keys[keyName] = false;
    }, { passive: false });
  }

  bindTouchBtn('btn-left', 'left');
  bindTouchBtn('btn-right', 'right');
  bindTouchBtn('btn-jump', 'up');

  // 遊戲主迴圈
  function loop() {
    player.update();
    updateEntities();

    drawBackground();
    drawWorld();
    player.draw();
    drawHUD();

    requestAnimationFrame(loop);
  }

  initLevel();
  loop();
</script>

</body>
</html>
